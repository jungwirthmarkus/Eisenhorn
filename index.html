<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eisenhorn</title>
<meta name="theme-color" content="#15191D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eisenhorn">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --ground:#15191D; --panel:#1F272D; --raise:#2A343C; --line:#3B4750;
    --bone:#EFECE5; --steel:#8494A0; --brass:#CBA33C; --ok:#5FA98C; --stark:#E0764A;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--ground); color:var(--bone);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  .wrap{max-width:520px; margin:0 auto; padding:22px 15px 70px}
  .head{display:flex; justify-content:space-between; align-items:flex-end; padding-bottom:15px; border-bottom:1px solid var(--line)}
  .kicker{font-family:var(--mono); font-size:9.5px; letter-spacing:.24em; color:var(--brass); text-transform:uppercase}
  h1{font-size:25px; font-weight:700; letter-spacing:-.03em; margin:1px 0 0}
  .tabs{display:flex; gap:3px}
  .tab{padding:6px 9px; border-radius:5px; border:none; background:transparent; color:var(--steel);
       font-family:var(--mono); font-size:11.5px; cursor:pointer}
  .tab.on{background:var(--bone); color:var(--ground)}
  .plans{display:flex; gap:8px; margin:17px 0 15px}
  .plan{flex:1; padding:10px 0 9px; border-radius:8px; cursor:pointer; background:transparent;
        border:1px solid var(--line); color:var(--steel); font-family:var(--mono); font-size:13px}
  .plan.on{border-color:var(--brass); background:var(--raise); color:var(--brass)}
  .plan small{display:block; font-size:10.5px; margin-top:3px; opacity:.8}
  .plan .due{color:var(--brass); opacity:1}
  .dot{width:6px;height:6px;border-radius:3px;background:var(--brass);display:inline-block;margin-left:6px;vertical-align:middle}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:11px}
  .card.saved{border-color:var(--ok)}
  .ctop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .name{font-size:16.5px; font-weight:660; letter-spacing:-.015em}
  .setup{font-size:12px; color:var(--steel); margin-top:2px}
  .vid{font-family:var(--mono); font-size:11px; color:var(--brass); text-decoration:none;
       border:1px solid var(--line); border-radius:5px; padding:4px 8px; white-space:nowrap}
  .readout{display:flex; gap:10px; margin-top:13px; background:var(--ground); border-radius:9px; padding:11px 13px}
  .ro{flex:1}
  .ro .lbl{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--steel); text-transform:uppercase}
  .ro .val{font-family:var(--mono); font-size:25px; line-height:1.25}
  .ro .val .u{font-size:11px; color:var(--steel); margin-left:3px}
  .ro .val .x{font-size:14px; color:var(--steel)}
  .sep{width:1px; background:var(--line)}
  .why{font-size:12px; color:var(--steel); margin-top:9px; line-height:1.45}
  .lastrow{display:flex; align-items:center; justify-content:space-between; gap:10px;
           margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
           font-family:var(--mono); font-size:11.5px; color:var(--steel)}
  button{font-family:inherit}
  .btn{width:100%; padding:12px 0; border-radius:8px; border:none; cursor:pointer; font-size:14.5px;
       background:var(--raise); color:var(--bone); margin-top:12px}
  .btn.ok{background:var(--ok); color:var(--ground)}
  .btn.brass{background:var(--brass); color:var(--ground); font-weight:680}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--steel)}
  .form{margin-top:13px; padding-top:13px; border-top:1px dashed var(--line)}
  .row{display:flex; gap:9px}
  .stp .lbl{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--steel);
            text-transform:uppercase; margin-bottom:5px}
  .stp{flex:1}
  .stepper{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .stepper button{width:46px; background:var(--raise); color:var(--bone); border:none; font-size:19px;
                  font-family:var(--mono); cursor:pointer; line-height:1}
  .stepper .v{flex:1; text-align:center; padding:8px 0; font-family:var(--mono); font-size:20px}
  .stepper input.v{background:transparent; border:none; color:var(--bone); width:100%;
                   -webkit-user-select:text; user-select:text; -moz-appearance:textfield; min-width:0}
  .stepper input.v:focus{outline:none; color:var(--brass)}
  .stepper input.v::-webkit-outer-spin-button,
  .stepper input.v::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .stepper .v .u{font-size:10px; color:var(--steel); margin-left:2px}
  .setline{display:flex; align-items:center; gap:10px; margin-bottom:7px}
  .setline .n{font-family:var(--mono); font-size:12px; color:var(--steel); width:46px}
  .hint{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--steel);
        text-transform:uppercase; margin:14px 0 6px}
  .dash{width:100%; padding:11px 0; background:transparent; border:1px dashed var(--line);
        border-radius:8px; color:var(--steel); font-family:var(--mono); font-size:11.5px; cursor:pointer}
  .hrow{display:flex; gap:12px; font-family:var(--mono); font-size:12.5px; padding:6px 0; color:var(--steel)}
  .hrow.now{color:var(--bone)}
  .hrow+.hrow{border-top:1px solid var(--line)}
  .empty{margin-top:44px; text-align:center; color:var(--steel); font-size:14px; line-height:1.6}
  .note{font-size:12.5px; color:var(--steel); line-height:1.55; margin:14px 0 0}
  .progress{display:flex; align-items:center; gap:10px; margin:0 2px 13px;
            font-family:var(--mono); font-size:11px; color:var(--steel)}
  .progress .bar{flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden}
  .progress .bar i{display:block; height:100%; background:var(--brass); transition:width .3s}
  .card.done{opacity:.62}
  .check{color:var(--ok); font-size:14px; margin-left:2px}
  .rules{margin:11px 0 0; padding-left:17px; color:var(--steel); font-size:13px; line-height:1.62}
  .rules li{margin-bottom:7px}
  .rules li:last-child{margin-bottom:0}
  .rules b{color:var(--bone); font-weight:600}
  .chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
  .chip{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
        color:var(--steel); border:1px solid var(--line); border-radius:4px; padding:2px 5px;
        white-space:nowrap; vertical-align:middle}
  .ramp{border:1px solid var(--brass); border-radius:10px; padding:12px 14px; margin:0 0 13px;
        background:rgba(203,163,60,.07)}
  .ramp b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
          text-transform:uppercase; color:var(--brass); margin-bottom:6px}
  .ramp span{display:block; font-size:12.5px; color:var(--steel); line-height:1.55}
  .ramp .deal{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:var(--bone)}
  .ro .sub{margin-top:4px}
  .barchip{display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:.1em;
           text-transform:uppercase; padding:2px 6px; border-radius:4px}
  .barchip.l{border:1px solid var(--line); color:var(--steel)}
  .barchip.n{border:1px dashed var(--line); color:var(--steel)}
  .barchip.s{background:var(--stark); border:1px solid var(--stark); color:var(--ground); font-weight:600}
  .seg button.stark.on{border-color:var(--stark); color:var(--stark)}
  .seg{display:flex; gap:7px}
  .seg button{flex:1; padding:9px 0; border-radius:7px; border:1px solid var(--line);
              background:transparent; color:var(--steel); font-family:var(--mono); font-size:12.5px; cursor:pointer}
  .seg button.on{border-color:var(--brass); background:var(--raise); color:var(--brass)}
  .marker{display:flex; gap:7px; margin-top:9px}
  .toggle{width:100%; padding:10px 0; border-radius:7px; border:1px dashed var(--line);
          background:transparent; color:var(--steel); font-size:12.5px; cursor:pointer}
  .toggle.on{border-style:solid; border-color:var(--ok); color:var(--ok)}
  .toggle.hart.on{border-color:var(--stark); color:var(--stark)}
  .chip.side{color:var(--brass); border-color:var(--brass)}
  .del{background:transparent; border:none; color:var(--steel); font-size:18px; line-height:1;
       padding:6px 4px 6px 14px; margin:-6px 0; cursor:pointer; opacity:.55}
  .del:hover{color:var(--brass)}
  .week{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:16px 2px 0;
        font-family:var(--mono); font-size:11px; color:var(--steel)}
  .pips{display:flex; gap:4px}
  .pips i{width:9px; height:9px; border-radius:5px; border:1px solid var(--line); display:block}
  .pips i.on{background:var(--brass); border-color:var(--brass)}
  .week .streak{margin-left:auto; color:var(--brass)}
  .progress .dauer{color:var(--bone)}
  .warm{font-family:var(--mono); font-size:11px; color:var(--steel); margin-top:9px;
        padding:7px 10px; border-left:2px solid var(--line); background:rgba(255,255,255,.02)}
  .pause{border:1px solid var(--line); border-radius:10px; padding:13px 14px; margin:13px 0 0;
         background:var(--panel)}
  .pause b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
           text-transform:uppercase; color:var(--bone); margin-bottom:7px}
  .pause span{display:block; font-size:12.5px; color:var(--steel); line-height:1.55; margin-bottom:7px}
  .frei{border:1px solid var(--line); border-radius:10px; padding:13px 14px; margin:16px 0 4px; background:var(--panel)}
  .frei b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
          text-transform:uppercase; color:var(--brass); margin-bottom:7px}
  .frei span{display:block; font-size:12.5px; color:var(--steel); line-height:1.55}
  .kat{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
       color:var(--steel); margin:20px 2px 9px}
  .vid.hide{background:transparent; cursor:pointer; color:var(--steel); font-size:13px; line-height:1; padding:4px 9px}
  .hiddenrow{display:flex; align-items:center; justify-content:space-between; gap:10px;
             padding:8px 0; border-top:1px solid var(--line); font-size:13px}
  .hiddenrow button{background:transparent; border:1px solid var(--line); border-radius:5px;
                    color:var(--brass); font-family:var(--mono); font-size:11px; padding:5px 9px; cursor:pointer}
  .version{font-family:var(--mono); font-size:10.5px; color:var(--line); text-align:center; margin:18px 0}
  .plans .plan{padding:9px 0 8px}
  .rate{display:flex; gap:7px; margin-top:11px}
  .rate button{flex:1; padding:8px 0; border-radius:7px; border:1px solid var(--line);
               background:transparent; color:var(--steel); font-family:var(--mono);
               font-size:11.5px; cursor:pointer}
  .rate button.up{border-color:var(--ok); color:var(--ok)}
  .rate button.down{border-color:var(--brass); color:var(--brass)}
  .ruhe{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:0 0 13px; background:var(--panel)}
  .ruhe b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
          text-transform:uppercase; color:var(--steel); margin-bottom:6px}
  .ruhe span{display:block; font-size:12.5px; color:var(--steel); line-height:1.55}
  .why-halten{color:var(--brass)}
  .setcount{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px}
  .setcount button{background:transparent; border:1px solid var(--line); color:var(--steel);
                   border-radius:6px; padding:7px 12px; font-family:var(--mono); font-size:11.5px; cursor:pointer}
  .setcount button:disabled{opacity:.35}
  .setcount span{font-family:var(--mono); font-size:11px; color:var(--steel)}
  .why-runter{color:var(--brass)}
  .why-hoch{color:var(--ok)}
  .files{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="kicker">Eisenhorn</div>
      <h1 id="title">Heute</h1>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="heute">Heute</button>
      <button class="tab" data-tab="frei">Frei</button>
      <button class="tab" data-tab="verlauf">Verlauf</button>
      <button class="tab" data-tab="mehr">Mehr</button>
    </div>
  </div>
  <div id="body"></div>
</div>
<input type="file" id="file" class="files" accept="application/json">

<script>
"use strict";

/* ---------- Übungen ---------- */
var V = "https://eisenhorn.com/de-de/training/kraftuebungen/";
var EX = [
  // zwei:1 bedeutet: wird pro Seite ausgeführt. Die App erzeugt daraus automatisch
  // zwei Karten, links und rechts, mit getrennter Progression.

  // A
  {id:"lat",      n:"Latzug zur Brust",        w:"A",  sets:3, lo:8,  hi:12, url:V+"latzug-zur-brust/",                    setup:"Griffstange, Horn hoch"},
  {id:"bank",     n:"Bodendrücken",            w:"A",  sets:3, lo:8,  hi:12, url:V+"229-bankdruecken-mit-griffstange/",    setup:"Griffstange, Rücken am Boden, Ellbogen setzen unten auf"},
  {id:"knie",     n:"Kniebeugen",              w:"A",  sets:3, lo:8,  hi:12, url:V+"203-kniebeugen/",                      setup:"Griffstange auf den Schultern", pm:1},
  {id:"face",     n:"Facepulls",               w:"A+", sets:2, lo:12, hi:18, url:V+"facepulls-am-seilzug/",                setup:"Seilzug in Kopfhöhe, beide Hände"},
  {id:"rot",      n:"Rumpfrotation",           w:"A+", sets:2, lo:10, hi:15, url:V+"rumpfrotation-am-seilzug/",            setup:"Seilzug in Brusthöhe", setupL:"Seilzug in Brusthöhe, Zug von rechts", setupR:"Seilzug in Brusthöhe, Zug von links", zwei:1},

  // B
  {id:"waden",    n:"Wadenheben",              w:"A+", sets:2, lo:12, hi:20, url:V+"219-wadenheben-mit-griff-am-horn/",    setup:"Griff am Horn, Fussballen erhöht, beide Beine"},

  // B
  {id:"rudern",   n:"Rudern einarmig",         w:"B",  sets:3, lo:8,  hi:12, url:V+"rudern-einarmig/",                     setup:"Griff, mittlere Höhe", zwei:1},
  {id:"schulter", n:"Schulterdrücken",         w:"B",  sets:3, lo:8,  hi:12, url:V+"200-schulterdruecken-vor-dem-kopf/",   setup:"Griffstange, Schulterhöhe"},
  {id:"beinpresse",n:"Beinpresse",             w:"B",  sets:3, lo:8,  hi:12, url:V+"beinpresse/",                          setup:"Rücken am Boden, Gesäss unter der Stange, Füsse hüftbreit auf der Griffstange"},
  {id:"rdl",      n:"Rumänisches Kreuzheben",  w:"B+", sets:2, lo:8,  hi:12, url:V+"205-rumaenisches-kreuzheben/",         setup:"Griffstange, Horn tief, Hüfte nach hinten", pm:1},
  {id:"plank",    n:"Unterarmstütz",           w:"B+", sets:2, lo:20, hi:60, url:V+"unterarmstuetz-mit-griffband/",        setup:"Griffband tief, Körper in einer Linie. Sekunden statt Wiederholungen", sek:1},
  {id:"rudernob", n:"Rudern Obergriff",        w:"B+", sets:2, lo:12, hi:18, url:V+"einarmiges-rudern-mit-obergriff-am-seilzug/", setup:"Seilzug, Obergriff, Ellbogen weit – trifft die hintere Schulter", zwei:1},

  // C
  {id:"rudernvb", n:"Rudern vorgebeugt",       w:"C",  sets:3, lo:8,  hi:12, url:V+"201-vorgebeugtes-rudern-mit-griffstange/",   setup:"Griffstange, Horn tief, Oberkörper vorgebeugt"},
  {id:"bruststeh",n:"Brustdrücken stehend",    w:"C",  sets:3, lo:8,  hi:12, url:V+"209-brustdruecken-stehend-mit-griffstange/", setup:"Griffstange, Horn auf Brusthöhe, Schrittstellung"},
  {id:"kreuz",    n:"Kreuzheben",              w:"C",  sets:3, lo:6,  hi:10, url:V+"kreuzheben-mit-griffstange-deadlift/", setup:"Griffstange auf Schienbeinhöhe, breiter Wechselgriff, Rücken unter Spannung", pm:1},
  {id:"latzugein", n:"Einarmiger Latzug",      w:"C+", sets:2, lo:10, hi:15, url:V+"einarmiger-latzug-am-seilzug/",         setup:"Seilzug hoch, eine Hand", zwei:1},
  {id:"bizeps",   n:"Bizepscurls",             w:"C+", sets:2, lo:10, hi:15, url:V+"bizepscurls/",                         setup:"Griffstange, Horn tief"},
  {id:"crunch",   n:"Crunches",                w:"C+", sets:2, lo:12, hi:20, url:V+"crunches-mit-griffband/",              setup:"Griffband hoch, Zug von oben, Bauch einrollen"},
  {id:"trizeps",  n:"Trizepsdrücken",          w:"C+", sets:2, lo:10, hi:15, url:V+"trizepsdruecken-am-seilzug/",          setup:"Seilzug hoch, beide Hände"},

  // X – freies Training zwischendurch, zählt nicht auf die Wochenrechnung
  {id:"aussenrot",  n:"Aussenrotation",          w:"X", cat:"Nacken & Schultern", sets:2, lo:12, hi:20, url:V+"aussenrotation-mit-seilzug/",  setup:"Seilzug auf Ellbogenhöhe, Oberarm bleibt am Körper", zwei:1},
  {id:"innenrot",   n:"Innenrotation",           w:"X", cat:"Nacken & Schultern", sets:2, lo:12, hi:20, url:V+"innenrotation-mit-seilzug/",   setup:"Seilzug auf Ellbogenhöhe, Oberarm bleibt am Körper", zwei:1},

  {id:"crossover",  n:"Crossover Crunch",        w:"X", cat:"Rumpf", sets:2, lo:10, hi:15, url:V+"crossover-crunch-am-seilzug/",   setup:"Seilzug hoch, kniend, diagonal nach unten ziehen", zwei:1},
  {id:"pike",       n:"Plank to Pike",             w:"X", cat:"Rumpf", sets:2, lo:8,  hi:15, url:V+"plank-to-pike/",                setup:"Höchste Kraftstufe, Griffband am Schienbein, ein Bein in der Schlaufe – Hüfte kontrolliert nach oben", zwei:1},
  {id:"russian",    n:"Russian Twist",           w:"X", cat:"Rumpf", sets:2, lo:10, hi:16, url:V+"russian-twist-am-seilzug/",      setup:"Seilzug in Brusthöhe, sitzend", setupL:"Seilzug in Brusthöhe, sitzend, Zug von rechts", setupR:"Seilzug in Brusthöhe, sitzend, Zug von links", zwei:1},
  {id:"seitcrunch", n:"Seitliche Crunches",      w:"X", cat:"Rumpf", sets:2, lo:10, hi:16, url:V+"seitliche-crunches-am-seilzug/", setup:"Seilzug hoch, seitlich kniend", zwei:1},

  {id:"front",      n:"Frontkniebeugen",         w:"X", cat:"Beine & Balance", sets:2, lo:8,  hi:12, url:V+"202-frontkniebeugen/",                setup:"Griffstange vor den Schultern, Ellbogen hoch"},
  {id:"sumo",       n:"Sumo-Kreuzheben",         w:"X", cat:"Beine & Balance", sets:2, lo:8,  hi:12, url:V+"sumo-kreuzheben-deadlifts-mit-griffstange/", setup:"Breiter Stand, enger Obergriff – schont den unteren Rücken"},
  {id:"einbeinkb",  n:"Einbeinige Kniebeuge",    w:"X", cat:"Beine & Balance", sets:2, lo:8,  hi:12, url:V+"einbeinige-kniebeuge-mit-entlastung/", setup:"Griffstange zum Entlasten", setupL:"Griffstange zum Entlasten, linkes Bein steht", setupR:"Griffstange zum Entlasten, rechtes Bein steht", zwei:1},
  {id:"einbeinkh",  n:"Einbeiniges Kreuzheben",  w:"X", cat:"Beine & Balance", sets:2, lo:8,  hi:12, url:V+"einbeiniges-kreuzheben-einarmig/",     setup:"Griff, Horn tief", setupL:"Griff, Horn tief, linkes Bein steht", setupR:"Griff, Horn tief, rechtes Bein steht", zwei:1},
  {id:"lunge",      n:"Ausfallschritte",         w:"X", cat:"Beine & Balance", sets:2, lo:10, hi:12, url:V+"ausfallschritte/",                    setup:"Griffband, Horn tief", setupL:"Griffband, Horn tief, linkes Bein vorne", setupR:"Griffband, Horn tief, rechtes Bein vorne", zwei:1},
  {id:"beinbeuger", n:"Beinbeuger liegend",      w:"X", cat:"Beine & Balance", sets:2, lo:10, hi:15, url:V+"beinbeuger-liegend/",                  setup:"Griffband am Fußgelenk, Horn tief", zwei:1},

  {id:"mountain",   n:"Mountain Climbers",       w:"X", cat:"Kurz & schweißtreibend", sets:2, lo:20, hi:45, url:V+"mountain-climbers/", setup:"Griffband, Stützposition, Beine wechseln sich ab", sek:1},
  {id:"plankjacks", n:"Plank Jacks",             w:"X", cat:"Kurz & schweißtreibend", sets:2, lo:20, hi:45, url:V+"plank-jacks/",       setup:"Griffband, Stützposition", sek:1},
  {id:"explosiv",   n:"Explosives Brustdrücken", w:"X", cat:"Kurz & schweißtreibend", sets:2, lo:10, hi:16, url:V+"213-explosives-brustdruecken-am-horn-alternierend/", setup:"Griff am Horn, Arme wechseln sich ab, zügig drücken"}
];

// Einseitige Übungen zu je zwei Karten aufklappen. Die linke behält die
// ursprüngliche Kennung, die rechte bekommt ein R angehängt.
EX = (function(liste){
  var out = [];
  for(var i=0;i<liste.length;i++){
    var e = liste[i];
    if(!e.zwei){ out.push(e); continue; }
    ["links","rechts"].forEach(function(seite){
      var k = {};
      for(var f in e) if(e.hasOwnProperty(f)) k[f] = e[f];
      k.side = seite;
      if(seite === "rechts") k.id = e.id + "R";
      if(seite === "links"  && e.setupL) k.setup = e.setupL;
      if(seite === "rechts" && e.setupR) k.setup = e.setupR;
      delete k.setupL; delete k.setupR; delete k.zwei;
      out.push(k);
    });
  }
  return out;
})(EX);

var PLANS = ["A","B","C"];
var VERSION = "2026-08-25";
var MAXW = 12;                 // das Horn hat 12 Widerstandsstufen
var FKEY = "eisenhorn.faktor.v1";
var faktor = 1.8;              // wie viel stärker die starke Stange ist, unter Mehr einstellbar

// Gemeinsame Skala: alles in Einheiten der leichten Stange.
// Nur so lassen sich Stufen über einen Stangenwechsel hinweg vergleichen.
function eff(w, bar){ return (bar||1) === 2 ? w * faktor : w; }

// Nächste Stufe. Ist die leichte Stange am Anschlag, wird auf die starke
// gewechselt – auf die kleinste Stufe, die mehr Last ergibt als bisher.
function steigern(w, bar, plus){
  bar = bar || 1;
  var neu = w + plus;
  if(neu <= MAXW) return { w:neu, bar:bar };
  if(bar === 1){
    var n = Math.ceil(eff(w,1) / faktor);
    while(eff(n,2) <= eff(w,1) && n < MAXW) n++;
    return { w:Math.min(n, MAXW), bar:2, wechsel:true };
  }
  return { w:MAXW, bar:2, ende:true };
}
var KATS = ["Nacken & Schultern","Rumpf","Beine & Balance","Kurz & schweißtreibend"];
function sichtbar(e){ return hidden.indexOf(e.id) < 0; }

// Reihenfolge im freien Training: noch nie gemacht zuerst, danach die,
// die dir gefallen, dann der Rest, ganz unten die aussortierten.
function rang(e){
  var gemacht = !!lastOf(e.id), r = ratings[e.id] || 0;
  if(!gemacht) return 0;
  if(r > 0) return 1;
  if(r === 0) return 2;
  return 3;
}
function freiSortiert(){
  return EX.filter(function(e){ return e.w==="X" && sichtbar(e); }).slice().sort(function(a,b){
    var ra = rang(a), rb = rang(b);
    if(ra !== rb) return ra - rb;
    var la = lastOf(a.id), lb = lastOf(b.id);
    return (la?new Date(la.date).getTime():0) - (lb?new Date(lb.date).getTime():0);
  });
}
function ex(id){ for(var i=0;i<EX.length;i++) if(EX[i].id===id) return EX[i]; return null; }

/* ---------- Speicher ---------- */
var KEY = "eisenhorn.v1";
var WKEY = "eisenhorn.weight.v1";
var XKEY = "eisenhorn.lastexport.v1";
var PKEY = "eisenhorn.pause.v1";
var HKEY = "eisenhorn.hidden.v1";
var RKEY = "eisenhorn.rating.v1";

// Umbenannte IDs. Nur Übungen, die inhaltlich unverändert sind – der Verlauf wandert mit.
// "rev"/"revR" fehlen hier bewusst: dort steckte früher eine andere Übung.
var IDMAP = { rudern2:"rudernvb", brust2:"bruststeh" };
var logs = [];
var weights = [];
var pausen = [];
var hidden = [];
var ratings = {};
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    logs = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(logs)) logs = [];
  }catch(e){ logs = []; }
  try{
    var rw = localStorage.getItem(WKEY);
    weights = rw ? JSON.parse(rw) : [];
    if(!Array.isArray(weights)) weights = [];
  }catch(e){ weights = []; }
  try{
    var rp = localStorage.getItem(PKEY);
    pausen = rp ? JSON.parse(rp) : [];
    if(!Array.isArray(pausen)) pausen = [];
  }catch(e){ pausen = []; }
  try{
    var rh = localStorage.getItem(HKEY);
    hidden = rh ? JSON.parse(rh) : [];
    if(!Array.isArray(hidden)) hidden = [];
  }catch(e){ hidden = []; }
  try{
    var rr = localStorage.getItem(RKEY);
    ratings = rr ? JSON.parse(rr) : {};
    if(!ratings || typeof ratings !== "object") ratings = {};
  }catch(e){ ratings = {}; }
  try{
    var rf = parseFloat(localStorage.getItem(FKEY));
    if(!isNaN(rf) && rf >= 1.1 && rf <= 4) faktor = rf;
  }catch(e){}
  migriere();
}
function migriere(){
  var geaendert = false;
  logs.forEach(function(l){ if(IDMAP[l.ex]){ l.ex = IDMAP[l.ex]; geaendert = true; } });
  hidden = hidden.map(function(id){
    if(IDMAP[id]){ geaendert = true; return IDMAP[id]; }
    return id;
  });
  if(geaendert) persist();
}

function persist(){
  try{
    localStorage.setItem(KEY, JSON.stringify(logs));
    localStorage.setItem(WKEY, JSON.stringify(weights));
    localStorage.setItem(PKEY, JSON.stringify(pausen));
    localStorage.setItem(HKEY, JSON.stringify(hidden));
    localStorage.setItem(RKEY, JSON.stringify(ratings));
    localStorage.setItem(FKEY, String(faktor));
    return true;
  }
  catch(e){ alert("Konnte nicht speichern. Ist der Speicher voll?"); return false; }
}

/* ---------- Logik ---------- */
function lastOf(id){
  var r = null;
  for(var i=0;i<logs.length;i++) if(logs[i].ex===id) r = logs[i];
  return r;
}
function allOf(id){ return logs.filter(function(l){ return l.ex===id; }); }

function isToday(iso){
  var d = new Date(iso), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function doneToday(id){
  var l = lastOf(id);
  return !!(l && isToday(l.date));
}

/* ---------- Aufbaurampe ---------- */
function startDate(){
  if(!logs.length) return null;
  var d = new Date(logs[0].date);
  for(var i=1;i<logs.length;i++){ var t = new Date(logs[i].date); if(t < d) d = t; }
  return d;
}
function rampWeek(){
  var s = startDate();
  if(!s) return 1;
  return Math.floor((Date.now() - s.getTime()) / (7*86400000)) + 1;
}
function rampSets(e){
  var w = rampWeek();
  if(w <= 2) return 1;
  if(w <= 4) return Math.min(2, e.sets);
  return e.sets;
}

// Mehrere Einträge desselben Tages mit gleicher Einstellung gehören zu einer Einheit.
// Ohne das würde eine auf Morgen und Abend geteilte Einheit als zwei Einheiten
// gewertet – und die zweite fast immer als Rückschritt.
function proTag(all){
  var out = [];
  all.forEach(function(l){
    var vor = out[out.length-1];
    if(vor && new Date(vor.date).toDateString() === new Date(l.date).toDateString()
           && vor.w === l.w && (vor.bar||1) === (l.bar||1)){
      vor.reps = vor.reps.concat(l.reps);
      vor.date = l.date;
      vor.easy = vor.easy || l.easy;
      vor.hard = vor.hard || l.hard;
    }else{
      out.push({ date:l.date, w:l.w, h:l.h, bar:l.bar, easy:l.easy, hard:l.hard, reps:l.reps.slice() });
    }
  });
  return out;
}

function suggest(id){
  var e = ex(id), all = proTag(allOf(id));
  if(!all.length) return {w:null,h:null,bar:1,reps:e.lo,sets:rampSets(e),tone:"neu",
    why: e.sek
      ? "Erstes Mal. Halte "+e.lo+" Sekunden sauber – gesteigert wird hier über die Zeit, nicht über den Widerstand."
      : "Erstes Mal. Widerstand so wählen, dass "+e.lo+" Wiederholungen fordernd sind."};

  var last = all[all.length-1];
  var bar = last.bar || 1;
  var top = last.reps.every(function(r){ return r >= e.hi; });

  // Zeit-Übungen laufen ausschliesslich über die Sekunden.
  // Widerstand und Stange bleiben unverändert, sie sind hier nur Setup-Information.
  if(e.sek){
    var best = Math.max.apply(null, last.reps);
    var wegS = tagDiff(last.date);
    if(wegS >= 10)
      return {w:last.w,h:last.h,bar:bar,reps:Math.max(e.lo, best-10),sets:rampSets(e),tone:"halten",
        why:wegS+" Tage her. Gleiche Einstellung, nur kürzer halten – der Rumpf ermüdet nach einer Pause schneller als du denkst."};
    if(last.hard)
      return {w:last.w,h:last.h,bar:bar,reps:best,sets:rampSets(e),tone:"halten",
        why:"Als zu schwer markiert. Bleib bei "+best+" Sekunden, bis es sich sauber anfühlt."};
    if(best >= e.hi)
      return {w:last.w,h:last.h,bar:bar,reps:e.hi,sets:rampSets(e),tone:"halten",
        why:e.hi+" Sekunden sind genug – länger bringt kaum mehr. Wird es zu leicht, nimm eine schwerere Variante statt mehr Zeit: im Stütz abwechselnd einen Fuss anheben, oder Plank to Pike aus dem freien Training."};
    return {w:last.w,h:last.h,bar:bar,reps:Math.min(e.hi, best+5),sets:rampSets(e),tone:"normal",
      why:"Fünf Sekunden mehr als beim besten Satz. Zeit ist hier die Steigerung, nicht der Widerstand."};
  }

  var vorher = all.length > 1 ? all[all.length-2] : null;

  // Nach einer Stufenerhöhung deutlich tiefer bei den Wiederholungen einsteigen.
  // Die Stufen am Horn sind unten nicht linear – eine Stufe mehr kann sich wie
  // deutlich mehr Last anfühlen, und dann tragen nur weniger Wiederholungen.
  var einstieg = Math.max(4, Math.round(e.lo * 0.75));

  function hoch(grund){
    var z = steigern(last.w, bar, 1);
    if(z.ende)
      return {w:MAXW,h:last.h,bar:2,reps:Math.min(Math.min.apply(null,last.reps)+1,e.hi),sets:rampSets(e),tone:"halten",
        why:"Stufe "+MAXW+" auf der starken Stange ist das Maximum. Ab hier über Wiederholungen und sauberere Ausführung steigern."};
    if(z.wechsel)
      return {w:z.w,h:last.h,bar:2,reps:einstieg,sets:rampSets(e),tone:"hoch",
        why:"Die leichte Stange ist bei "+MAXW+" am Anschlag. Wechsle auf die starke Stange, Stufe "+z.w+" – und fang bei "+einstieg+" Wiederholungen an."};
    return {w:z.w,h:last.h,bar:z.bar,reps:einstieg,sets:rampSets(e),tone:"hoch",why:grund};
  }

  // Wiedereinstieg nach längerer Unterbrechung
  var weg = tagDiff(last.date);
  if(weg >= 42)
    return {w:Math.max(1,last.w-1),h:last.h,bar:bar,reps:einstieg,sets:rampSets(e),tone:"halten",
      why:weg+" Tage her. Nach so langer Pause eine Stufe zurück und nur "+einstieg+" Wiederholungen. In zwei bis drei Einheiten bist du wieder da."};
  if(weg >= 10)
    return {w:last.w,h:last.h,bar:bar,reps:einstieg,sets:rampSets(e),tone:"halten",
      why:weg+" Tage her. Gleiche Stufe, aber nur "+einstieg+" Wiederholungen – so kommst du ohne Muskelkater zurück, statt gleich zurückgestuft zu werden."};

  var min = Math.min.apply(null,last.reps);

  // "War zu schwer" – du bestimmst, dass es nicht weitergeht
  if(last.hard){
    if(vorher && vorher.hard && last.w > 1)
      return {w:Math.max(1,last.w-1),h:last.h,bar:bar,reps:e.lo,sets:rampSets(e),tone:"runter",
        why:"Zweimal als zu schwer markiert. Eine Stufe zurück und von dort sauber aufbauen."};
    return {w:last.w,h:last.h,bar:bar,reps:min,sets:rampSets(e),tone:"halten",
      why:"Als zu schwer markiert. Gleiche Stufe, gleiche Wiederholungen – bleib hier, bis es sich leicht anfühlt."};
  }

  if(last.easy)
    return hoch("Als zu leicht markiert. Eine Stufe hoch, dafür nur "+einstieg+" Wiederholungen – das ist der ehrliche Preis für mehr Last.");
  if(top)
    return hoch("Alle Sätze auf "+e.hi+". Eine Stufe hoch, dafür zurück auf "+einstieg+" Wiederholungen.");

  // Einheiten am Stück mit derselben Einstellung – Stufe und Stange
  var streak = [];
  for(var i=all.length-1; i>=0; i--){
    if(all[i].w === last.w && (all[i].bar||1) === bar) streak.unshift(all[i]); else break;
  }
  // Mittelwert pro Satz, nicht Summe: sonst würde eine Kurzeinheit
  // mit weniger Sätzen fälschlich als Rückschritt gewertet.
  var mean = function(x){
    var t = 0;
    for(var k=0;k<x.reps.length;k++) t += x.reps[k];
    return x.reps.length ? t/x.reps.length : 0;
  };

  // Wie oft in Folge gab es keine Verbesserung?
  var stalls = 0;
  for(var j=streak.length-1; j>0; j--){
    if(mean(streak[j]) <= mean(streak[j-1])) stalls++; else break;
  }

  if(stalls >= 2)
    return {w:Math.max(1,last.w-1),h:last.h,bar:bar,reps:e.lo,sets:rampSets(e),tone:"runter",
      why:"Dreimal keine Steigerung. Eine Stufe zurück und sauber neu aufbauen – das ist kein Rückschritt, sondern Anlauf."};

  if(stalls === 1)
    return {w:last.w,h:last.h,bar:bar,reps:Math.min(min+1,e.hi),sets:rampSets(e),tone:"halten",
      why:"Letztes Mal keine Steigerung. Widerstand halten, Technik und Tempo prüfen, Schlaf im Blick behalten."};

  return {w:last.w,h:last.h,bar:bar,reps:Math.min(min+1,e.hi),sets:rampSets(e),tone:"normal",
    why:"Gleicher Widerstand, eine Wiederholung mehr als beim schwächsten Satz."};
}

function backupAlt(){
  try{
    var v = localStorage.getItem(XKEY);
    if(!v) return -1;
    return Math.floor((Date.now() - new Date(v).getTime())/86400000);
  }catch(e){ return -1; }
}
function backupText(){
  var n = backupAlt();
  if(n < 0) return "noch nie";
  return n === 0 ? "heute" : n === 1 ? "gestern" : "vor "+n+" Tagen";
}

/* ---------- Pausen ---------- */
function aktivePause(){
  for(var i=pausen.length-1;i>=0;i--) if(!pausen[i].bis) return pausen[i];
  return null;
}
function istPause(tag){                       // Date -> in einer Pause?
  var t = tag.getTime();
  for(var i=0;i<pausen.length;i++){
    var von = new Date(pausen[i].von).getTime();
    var bis = pausen[i].bis ? new Date(pausen[i].bis).getTime() : Date.now();
    if(t >= von && t <= bis) return true;
  }
  return false;
}
function pausentageInWoche(von){
  var n = 0;
  for(var i=0;i<7;i++){
    var t = new Date(von.getTime() + i*86400000);
    if(t.getTime() <= Date.now() && istPause(t)) n++;
  }
  return n;
}
function pauseTage(p){
  return Math.floor((Date.now() - new Date(p.von).getTime())/86400000);
}

/* ---------- Woche & Dauer ---------- */
function weekStart(d){
  var x = new Date(d), day = (x.getDay()+6)%7;   // Montag = 0
  x.setHours(0,0,0,0); x.setDate(x.getDate()-day);
  return x;
}
function trainingstage(von, bis){
  var tage = {};
  logs.forEach(function(l){
    var e = ex(l.ex);
    if(!e || e.w.charAt(0) === "X") return;      // freies Training zählt hier nicht mit
    var t = new Date(l.date);
    if(t >= von && t < bis) tage[t.toDateString()] = 1;
  });
  return Object.keys(tage).length;
}
function wocheZaehler(){
  var a = weekStart(new Date());
  return trainingstage(a, new Date(a.getTime() + 7*86400000));
}
function wochenSerie(){
  var n = 0, a = weekStart(new Date());
  if(trainingstage(a, new Date(a.getTime()+7*86400000)) >= 3) n++;
  var cur = new Date(a);
  for(var i=0;i<520;i++){
    cur.setDate(cur.getDate()-7);
    var ende = new Date(cur.getTime()+7*86400000);
    if(ende.getTime() < new Date(logs.length?logs[0].date:Date.now()).getTime()) break;
    if(trainingstage(cur, ende) >= 3){ n++; continue; }
    if(pausentageInWoche(cur) >= 4) continue;   // Pausenwoche zählt nicht, bricht aber auch nicht
    break;
  }
  return n;
}

// Grobe Schätzung: Umbau 60 s, Aufwärmsatz 105 s, Arbeitssatz 45 s, Pause 75 s
function dauerMin(liste){
  var s = 0;
  liste.forEach(function(e){
    if(doneToday(e.id)) return;
    var n = rampSets(e), warm = suggest(e.id).w != null ? 105 : 0;
    s += 60 + warm + n*45 + Math.max(0,n-1)*75;
  });
  return Math.round(s/60);
}

function waermer(s){
  if(s.w == null) return null;
  return { w: Math.max(1, Math.min(MAXW, Math.round(s.w/2))), reps: 10 };
}

/* ---------- Körpergewicht ---------- */
function avgLast(n, skip){
  var s = weights.slice(); // chronologisch
  var end = s.length - (skip||0);
  var part = s.slice(Math.max(0,end-n), end);
  if(!part.length) return null;
  var t = 0;
  for(var i=0;i<part.length;i++) t += part[i].kg;
  return t/part.length;
}

function lastDate(prefix){
  var d = null;
  for(var i=0;i<logs.length;i++){
    var e = ex(logs[i].ex);
    if(e && e.w.charAt(0)===prefix){ var t = new Date(logs[i].date); if(!d||t>d) d = t; }
  }
  return d;
}
// Kalendertage, nicht verstrichene Stunden. Gestern Abend trainiert und heute
// früh geschaut wären sonst "0 Tage" gewesen.
function tagDiff(d){
  var a = new Date(d); a.setHours(0,0,0,0);
  var b = new Date();  b.setHours(0,0,0,0);
  return Math.round((b.getTime()-a.getTime())/86400000);
}
function ago(d){
  if(!d) return "noch nie";
  var n = tagDiff(d);
  return n===0 ? "heute schon" : n===1 ? "gestern" : "vor "+n+" Tagen";
}
// Tage seit der letzten Krafteinheit, egal welches Workout
function seitLetzterEinheit(){
  var neu = null;
  PLANS.forEach(function(p){
    var d = lastDate(p);
    if(d && (!neu || d > neu)) neu = d;
  });
  return neu ? tagDiff(neu) : null;
}
function fmt(iso){
  var d = new Date(iso);
  return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+".";
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------- Zustand ---------- */
var tab = "heute", plan = "A", showExtra = false, openId = null, saved = {};
var draft = {};
var wOpen = false, wDraft = 88;

function due(){
  var best = PLANS[0], oldest = Infinity;
  for(var i=0;i<PLANS.length;i++){
    var d = lastDate(PLANS[i]);
    var t = d ? d.getTime() : -1;      // nie trainiert schlägt alles
    if(t < oldest){ oldest = t; best = PLANS[i]; }
  }
  return best;
}

/* ---------- Rendern ---------- */
function spark(vals){
  if(vals.length < 2) return "";
  var W=100,H=26,max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),span=(max-min)||1,p=[];
  for(var i=0;i<vals.length;i++)
    p.push(((i/(vals.length-1))*W).toFixed(1)+","+(H-((vals[i]-min)/span)*(H-4)-2).toFixed(1));
  return '<svg viewBox="0 0 '+W+' '+H+'" width="88" height="26" preserveAspectRatio="none">'+
         '<polyline points="'+p.join(" ")+'" fill="none" stroke="#CBA33C" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

function stepper(kind, i, val, unit){

    '<button data-step="'+kind+'" data-i="'+i+'" data-d="-1">−</button>'+

    '<button data-step="'+kind+'" data-i="'+i+'" data-d="1">+</button></div>';
}

function heightField(val){

  var d = due();

  h += '<div class="plans">';
  PLANS.forEach(function(p){
    var ld = lastDate(p), istDran = (d===p);
    var text = istDran ? (ruhetag ? (seit===0 ? "Pause" : "morgen dran") : "dran") : ago(ld);
    h += '<button class="plan'+(plan===p?" on":"")+'" data-plan="'+p+'">'+p+
         (istDran && !ruhetag ? '<span class="dot"></span>' : '')+
         '<small class="'+(istDran && !ruhetag ? "due" : "")+'">'+text+'</small></button>';

  if(ruhetag)
    h += '<div class="ruhe"><b>Pausentag</b><span>'+
      (seit===0
        ? 'Heute hast du schon trainiert. Die nächste Krafteinheit steht übermorgen an – Workout '+d+'.'
        : 'Gestern trainiert, heute erholt sich der Muskel. Morgen ist Workout '+d+' dran.')+
      ' Bewegung tut trotzdem gut: gehen, rudern, radeln. Und wenn du unbedingt ans Horn willst, hält dich niemand auf.</span></div>';

  var core = EX.filter(function(e){ return e.w===plan && sichtbar(e); });

    var erste = core.length ? core[0].n : "der ersten Übung";
    h += '<div class="ramp"><b>Aufbauphase · Woche '+rw+' von 4</b><span>'+
      (rw <= 2
        ? 'Heute ein Satz pro Übung. Ziel ist nur, deine Einstellungen zu finden und einzutragen – kein Leistungsanspruch. Das hält auch den Muskelkater klein.'
        : 'Heute zwei Sätze pro Übung. Ab jetzt greift die Progression, die Zahlen fangen an zu steigen.')+
      '</span><span class="deal">Dein Vertrag: ein Satz '+esc(erste)+'. Alles danach ist freiwillig.</span></div>';
  }

  var fertig = core.filter(function(e){ return doneToday(e.id); }).length;
  var min = dauerMin(core);
  var pct = core.length ? Math.round(fertig/core.length*100) : 0;
  h += '<div class="progress"><span>'+fertig+' von '+core.length+' heute erledigt</span>'+
       '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
       '<span class="dauer">'+(min>0?'noch ~'+min+' min':'fertig')+'</span></div>';
  if(!core.length)
    h += '<p class="note" style="margin:0 2px 13px">In diesem Workout ist keine Übung sichtbar. Unter Mehr kannst du ausgeblendete Übungen zurückholen.</p>';

  var lw = weights.length ? new Date(weights[weights.length-1].date) : null;
  var lwTage = lw ? Math.floor((Date.now()-lw.getTime())/86400000) : -1;

         '</button>';

  if(showExtra){
    h += '<div style="height:11px"></div>';
    EX.filter(function(e){ return e.w===plan+"+" && sichtbar(e); }).forEach(function(e){ h += cardHTML(e); });
  }
  return h;
}

  '<p class="version">Eisenhorn · Stand '+VERSION+'</p>'+

  '<div class="card"><div class="name">Zurücksetzen</div>'+
    '<p class="note">Löscht alle Einträge auf diesem Gerät. Vorher exportieren.</p>'+
    '<button class="btn ghost" data-reset="1">Alles löschen</button></div>';
}

function render(){
  document.getElementById("title").textContent =
    tab==="heute" ? "Heute" : tab==="frei" ? "Zwischendurch" : tab==="verlauf" ? "Steigerung" : "Regeln";
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.classList.toggle("on", b.dataset.tab===tab);
  });
  document.getElementById("body").innerHTML =
    tab==="heute" ? viewHeute() : tab==="frei" ? viewFrei() : tab==="verlauf" ? viewVerlauf() : viewMehr();
}

/* ---------- Interaktion ---------- */
document.addEventListener("click", function(evt){
  var t = evt.target.closest ? evt.target.closest("[data-tab],[data-plan],[data-open],[data-cancel],[data-save],[data-step],[data-sets],[data-del],[data-fak],[data-hide],[data-show],[data-rate],[data-pause],[data-pauseend],[data-bar],[data-easy],[data-hard],[data-extra],[data-export],[data-import],[data-reset],[data-wopen],[data-wcancel],[data-wsave]") : null;
  if(!t) return;
  var ds = t.dataset;

  if(ds.wopen){
    wDraft = weights.length ? weights[weights.length-1].kg : 88;
    wOpen = true; return render();
  }
  if(ds.wcancel){ wOpen = false; return render(); }
  if(ds.wsave){
    weights.push({ date:new Date().toISOString(), kg: Math.round(wDraft*10)/10 });
    persist(); wOpen = false; return render();
  }

  if(ds.tab){ tab = ds.tab; openId = null; return render(); }
  if(ds.plan){ plan = ds.plan; openId = null; return render(); }
  if(ds.extra){ showExtra = !showExtra; return render(); }

  if(ds.open){
    var s = suggest(ds.open);
    draft = { h: s.h==null?100:s.h, w: Math.min(MAXW, s.w==null?6:s.w), bar: s.bar||1, easy:false, hard:false, reps: [] };
    for(var i=0;i<s.sets;i++) draft.reps.push(s.reps);
    openId = ds.open;
    render();
    var el = document.querySelector('[data-card="'+ds.open+'"]');
    if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  if(ds.cancel){ openId = null; return render(); }
  if(ds.bar){ draft.bar = parseInt(ds.bar,10); return render(); }
  if(ds.hard){ draft.hard = !draft.hard; if(draft.hard) draft.easy = false; return render(); }
  if(ds.easy){ draft.easy = !draft.easy; if(draft.easy) draft.hard = false; return render(); }

  if(ds.fak){
    faktor = Math.max(1.1, Math.min(4, Math.round((faktor + parseInt(ds.fak,10)*0.1)*10)/10));
    persist(); return render();
  }

  if(ds.rate){
    var v = parseInt(ds.v,10);
    ratings[ds.rate] = (ratings[ds.rate]||0) === v ? 0 : v;   // nochmal tippen hebt auf
    persist(); return render();
  }

  if(ds.hide){
    var eh = ex(ds.hide);
    if(eh && confirm("„"+eh.n+"“ ausblenden? Unter Mehr kannst du sie jederzeit zurückholen.")){
      hidden.push(ds.hide); persist(); render();
    }
    return;
  }
  if(ds.show){
    var ix = hidden.indexOf(ds.show);
    if(ix >= 0){ hidden.splice(ix,1); persist(); render(); }
    return;
  }

  if(ds.pause){
    if(!aktivePause()){
      pausen.push({ von:new Date().toISOString(), bis:null, grund:ds.pause });
      persist();
    }
    tab = "heute"; return render();
  }
  if(ds.pauseend){
    var ap = aktivePause();
    if(ap){ ap.bis = new Date().toISOString(); persist(); }
    return render();
  }

  if(ds.del){
    var idx = parseInt(ds.del,10);
    var r = logs[idx];
    if(r && confirm("Eintrag vom "+fmt(r.date)+" löschen?")){
      logs.splice(idx,1); persist(); render();
    }
    return;
  }

  if(ds.sets){
    var n = parseInt(ds.sets,10);
    if(n > 0 && draft.reps.length < 6) draft.reps.push(draft.reps[draft.reps.length-1]);
    if(n < 0 && draft.reps.length > 1) draft.reps.pop();
    return render();
  }

  if(ds.step){
    var d = parseInt(ds.d,10);
    if(ds.step==="kg") wDraft = Math.max(0, Math.round((wDraft + d*0.1)*10)/10);
    else if(ds.step==="h") draft.h = Math.max(0, Math.min(300, draft.h + d));
    else if(ds.step==="w") draft.w = Math.max(1, Math.min(MAXW, draft.w + d));
    else {
      var i2 = parseInt(ds.i,10);
      var eo = openId ? ex(openId) : null;
      var schritt = (eo && eo.sek) ? 5 : 1;
      draft.reps[i2] = Math.max(0, draft.reps[i2] + d*schritt);
    }
    return render();
  }

  if(ds.save){
    logs.push({ ex: ds.save, date: new Date().toISOString(), h: draft.h, w: draft.w, bar: draft.bar, easy: draft.easy, hard: draft.hard, reps: draft.reps.slice() });
    persist();
    openId = null;
    saved[ds.save] = true;
    render();
    setTimeout(function(){ delete saved[ds.save]; if(tab==="heute") render(); }, 2000);
    return;
  }

  if(ds.export){
    var payload = { version:3, exported:new Date().toISOString(), logs:logs, weights:weights, pausen:pausen, hidden:hidden, ratings:ratings };
    var blob = new Blob([JSON.stringify(payload,null,1)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "eisenhorn-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    try{ localStorage.setItem(XKEY, new Date().toISOString()); }catch(err){}
    render();
    return;
  }
  if(ds.import){ document.getElementById("file").click(); return; }
  if(ds.reset){
    if(confirm("Wirklich alle Einträge löschen?")){ logs = []; weights = []; pausen = []; ratings = {}; persist(); render(); }
    return;
  }
});

document.addEventListener("input", function(e){
  var t = e.target;
  if(!t || !t.dataset || t.dataset.inp !== "h") return;
  if(t.value === "") return;                       // beim Leeren nicht überschreiben
  var n = parseInt(t.value, 10);
  if(!isNaN(n)) draft.h = Math.max(0, Math.min(300, n));
});

document.addEventListener("blur", function(e){
  var t = e.target;
  if(!t || !t.dataset || t.dataset.inp !== "h") return;
  t.value = draft.h;                               // leeres oder unsinniges Feld zurücksetzen
}, true);

document.getElementById("file").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(Array.isArray(d)){          // altes Format: nur Trainingseinträge
        logs = d;
      }else if(d && Array.isArray(d.logs)){
        logs = d.logs;
        weights = Array.isArray(d.weights) ? d.weights : [];
        pausen = Array.isArray(d.pausen) ? d.pausen : [];
        hidden = Array.isArray(d.hidden) ? d.hidden : [];
        ratings = (d.ratings && typeof d.ratings === "object") ? d.ratings : {};
      }else throw new Error("Format");
      persist(); render();
      alert(logs.length + " Trainingseinträge und " + weights.length + " Gewichtswerte eingelesen.");
    }catch(err){ alert("Datei konnte nicht gelesen werden."); }
  };
  r.readAsText(f);
  e.target.value = "";
});

/* ---------- Start ---------- */
load();
plan = due();
render();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
</body>
</html>
